configuration:
  image_size:
    name: Image size
    description: OpenAI-compatible output size. The same size is used for local image backends.
  image_steps:
    name: Image steps
    description: Advanced local-backend setting. Diffusion sampling steps used by ComfyUI; ignored by OpenAI. Leave at the default unless you know the backend needs another value.
  archive_images:
    name: Archive images
    description: Keep dated PNG copies under the archive folder. Each image is approximately 2 MB.
  regenerate_today:
    name: Regenerate today's event
    description: Request one fresh image for today's event. The option resets automatically after a successful generation.
  regenerate_on_startup:
    name: Regenerate on startup
    description: Create a fresh image every time the app starts, even when today's image already exists. This uses an image-generation credit on each startup.
