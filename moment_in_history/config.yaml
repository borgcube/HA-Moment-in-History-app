name: Moment in history
version: "1.9.21"
slug: moment_in_history
description: Daily historical moment artwork for the Home Assistant dashboard
startup: application
boot: auto
init: true
homeassistant_api: true
hassio_api: true
hassio_role: default
ingress: true
ingress_port: 8099
arch:
  - amd64
  - aarch64
map:
  - type: homeassistant_config
    path: /config
    read_only: false
options:
  image_size: 1024x1024
  image_steps: 9
  archive_images: false
  run_on_startup: false
  generate_on_restart: false
schema:
  image_size: list(1024x1024|1536x1024|1024x1536)
  image_steps: int(1,50)
  archive_images: bool
  run_on_startup: bool
  generate_on_restart: bool
