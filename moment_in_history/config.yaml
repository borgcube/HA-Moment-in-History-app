name: Moment in history
version: "1.2.0"
slug: moment_in_history
description: Daily historical moment artwork for the Home Assistant dashboard
startup: application
boot: auto
init: true
arch:
  - amd64
  - aarch64
map:
  - type: homeassistant_config
    path: /config
    read_only: false
options:
  primary_ollama_url: http://openclaw.borgcube.com:11434
  fallback_ollama_url: http://storage01.borgcube.com:11434
  text_model: qwen3.8:27b-mlx
  fallback_text_model: gemma4:e4b
  image_backend_url: http://storage01.borgcube.com:8188
  image_backend_fallback_url: ""
  image_provider: openai
  openai_api_key: ""
  openai_image_model: gpt-image-2
  openai_image_quality: high
  openai_image_size: 1024x1024
  image_model: Tongyi-MAI/Z-Image-Turbo
  image_width: 1024
  image_height: 1024
  image_steps: 9
  schedule_time: "00:05"
  run_on_startup: true
schema:
  primary_ollama_url: str
  fallback_ollama_url: str
  text_model: str
  fallback_text_model: str
  image_backend_url: str
  image_backend_fallback_url: str
  image_provider: match(openai|lan)
  openai_api_key: password
  openai_image_model: str
  openai_image_quality: match(low|medium|high)
  openai_image_size: match(^[0-9]+x[0-9]+$)
  image_model: str
  image_width: int
  image_height: int
  image_steps: int
  schedule_time: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  run_on_startup: bool
