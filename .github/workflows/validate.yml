name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip PyYAML -r moment_in_history/requirements.txt

      - name: Validate YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in [
              Path("moment_in_history/config.yaml"),
              Path("moment_in_history/translations/en.yaml"),
              Path("examples/overview-dashboard.yaml"),
              Path("examples/input_boolean.yaml"),
              Path("examples/app-options.yaml.example"),
              Path("examples/moment-in-history-email.yaml"),
          ]:
              with path.open(encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"validated {path}")
          PY

      - name: Compile Python
        run: python -m py_compile moment_in_history/moment_in_history.py

      - name: Run tests
        run: python -m unittest discover -s tests -v
